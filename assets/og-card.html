<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Share card source | Jinghao Chen</title>
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #f8f6f2;
    color: #191a17;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .top { display: flex; align-items: center; gap: 20px; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; }
  .label {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #6d6d64;
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 92px; font-weight: 500; letter-spacing: -0.035em; line-height: 0.98;
    margin: 0;
  }
  h1 .alt { font-style: italic; color: #6d6d64; }
  .role { font-size: 30px; color: #45463f; margin-top: 22px; }
  .stack {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 19px; color: #6d6d64; margin-top: 18px; letter-spacing: 0.01em;
  }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .url {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 21px; color: #0f5f57; letter-spacing: 0.02em;
  }
  .bar { display: flex; gap: 6px; }
  .bar span { display: block; width: 26px; height: 6px; border-radius: 3px; background: #0f5f57; }
  .bar span:nth-child(2) { background: #b4aa92; }
  .bar span:nth-child(3) { background: #e0d9c9; }
</style>
</head>
<body>
  <div class="top">
    <img class="avatar" src="image.png" alt="">
    <div class="label">Portfolio</div>
  </div>

  <div>
    <h1>Jinghao <span class="alt">(Adam)</span> Chen</h1>
    <p class="role">Data Analyst &amp; Analytics Engineer</p>
    <p class="stack">Microsoft Fabric · dbt · Airflow · Power BI · Python · SQL</p>
  </div>

  <div class="bottom">
    <p class="url">chenjinghao.github.io</p>
  </div>
</body>
</html>
