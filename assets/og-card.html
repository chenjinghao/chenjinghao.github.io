<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Share card source | Adam Chen</title>
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 54px 64px;
    overflow: hidden;
    background: #f8f6f2;
    color: #191a17;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body::after {
    content: "";
    position: absolute;
    right: -170px;
    top: -200px;
    width: 540px;
    height: 540px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15, 95, 87, 0.10), rgba(15, 95, 87, 0) 68%);
  }
  .avatar {
    width: 124px; height: 124px; border-radius: 50%;
    object-fit: cover; border: 2px solid #cfcabf;
    box-shadow: 0 12px 26px -18px rgba(0, 0, 0, 0.6);
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 196px;
    font-weight: 500;
    letter-spacing: -0.045em;
    line-height: 0.86;
  }
  .rule {
    width: 150px; height: 6px; border-radius: 3px;
    background: #0f5f57; margin: 22px 0 18px;
  }
  .role {
    font-size: 62px;
    letter-spacing: -0.015em;
    color: #45463f;
  }
  .url {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 38px;
    letter-spacing: 0.01em;
    color: #0f5f57;
  }
</style>
</head>
<body>
  <img class="avatar" src="image.png" alt="">
  <div>
    <h1>Adam Chen</h1>
    <div class="rule"></div>
    <p class="role">Data Analyst &amp; Analytics Engineer</p>
  </div>
  <p class="url">chenjinghao.github.io</p>
</body>
</html>
