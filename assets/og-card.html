<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Share card source | Adam Chen</title>
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 66px 76px;
    overflow: hidden;
    background: #f8f6f2;
    color: #191a17;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  /* soft accent glow in the corner, echoing the site's teal */
  body::after {
    content: "";
    position: absolute;
    right: -160px;
    top: -180px;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15, 95, 87, 0.10), rgba(15, 95, 87, 0) 68%);
  }
  .top { display: flex; align-items: center; gap: 22px; }
  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    object-fit: cover; border: 1px solid #cfcabf;
    box-shadow: 0 10px 24px -18px rgba(0, 0, 0, 0.6);
  }
  .label {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #6d6d64;
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 128px; font-weight: 500; letter-spacing: -0.04em; line-height: 0.92;
  }
  .rule {
    width: 96px; height: 3px; border-radius: 2px;
    background: #0f5f57; margin: 26px 0 22px;
  }
  .role { font-size: 34px; color: #45463f; letter-spacing: -0.01em; }
  .bottom { display: flex; align-items: baseline; justify-content: space-between; }
  .url {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 22px; letter-spacing: 0.02em; color: #0f5f57;
  }
  .loc {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: #6d6d64;
  }
</style>
</head>
<body>
  <div class="top">
    <img class="avatar" src="image.png" alt="">
    <div class="label">Portfolio</div>
  </div>

  <div>
    <h1>Adam Chen</h1>
    <div class="rule"></div>
    <p class="role">Data Analyst &amp; Analytics Engineer</p>
  </div>

  <div class="bottom">
    <p class="url">chenjinghao.github.io</p>
    <p class="loc">Surrey, BC</p>
  </div>
</body>
</html>
