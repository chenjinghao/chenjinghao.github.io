<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Share card source | Adam Chen</title>
<!--
  Source for assets/og-image.png. Render at exactly 1200x630:
  msedge --headless --window-size=1200,630 --screenshot=og-image.png og-card.html

  Sized for LinkedIn, which downsizes the card to 480px wide and re-encodes it
  as JPEG. That is why the type is heavy and there is no small print: thin
  strokes and anything under ~40px turn to mush at 480px.
-->
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
    padding: 56px 64px;
    background: #ffffff;
    color: #10120f;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #d8d4c9;
  }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 200px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 0.9;
  }
  .rule {
    width: 170px;
    height: 9px;
    border-radius: 5px;
    background: #0f5f57;
    margin: 20px 0 22px;
  }
  .role {
    font-size: 62px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: #35372f;
  }
</style>
</head>
<body>
  <img class="avatar" src="image.png" alt="">
  <div>
    <h1>Adam Chen</h1>
    <div class="rule"></div>
    <p class="role">Data Analyst &amp; Analytics Engineer</p>
  </div>
</body>
</html>
